[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-fraud-pipeline"
version = "0.1.0"
description = "Temporal accounting fraud research with Beneish features and SHAP drift audits"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4", "shap>=0.47,<1",
]

[project.urls]
Repository = "https://github.com/babybooghost/sec-fraud-detection"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[project.scripts]
sec-fraud = "pipeline:main"

[tool.setuptools]
py-modules = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_pipeline.py"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
